name: Publish to NPM

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm'
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

# One run per tag, a fixed group would drop pending runs
concurrency:
  group: publish-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify and pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Confirm publish
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.confirm != 'publish' }}
        run: |
          echo "❌ Workflow disabled. To enable, type 'publish' when triggering manually."
          exit 1

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Run CI checks
        run: npm run ci

      # dist/ is built by the CI checks, skip the prepack build
      - name: Pack tarball
        run: npm pack --ignore-scripts

      - name: Upload tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: "*.tgz"
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to NPM
    needs: verify
    permissions:
      contents: read
      id-token: write
    uses: codemie-ai/ci-workflows/.github/workflows/reusable-publish-npm.yml@main
    with:
      artifact-name: npm-package
      dist-tag: ${{ contains(needs.verify.outputs.version, '-rc') && 'rc' || 'latest' }}

  installers:
    name: Publish installers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: publish
    environment: prod
    permissions:
      contents: read
    env:
      ARTIFACTORY_INSTALL_URL: ${{ secrets.ARTIFACTORY_INSTALL_URL }}
      ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Prepare installer artifacts
        run: npm run prepare:install-artifacts

      - name: Upload installer artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codemie-installers
          path: artifacts/install

      - name: Publish installer artifacts to Artifactory
        if: ${{ env.ARTIFACTORY_INSTALL_URL != '' && env.ARTIFACTORY_TOKEN != '' }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for file in artifacts/install/*; do
            name=$(basename "$file")
            curl -fsS -H "Authorization: Bearer ${ARTIFACTORY_TOKEN}" \
              -T "$file" \
              "${ARTIFACTORY_INSTALL_URL}/${VERSION}/${name}"
            curl -fsS -H "Authorization: Bearer ${ARTIFACTORY_TOKEN}" \
              -T "$file" \
              "${ARTIFACTORY_INSTALL_URL}/stable/${name}"
          done
