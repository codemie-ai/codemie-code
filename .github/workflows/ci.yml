name: CI

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ '**' ]
    types: [opened, synchronize, reopened]
  workflow_call:

permissions:
  contents: read

jobs:
  secrets-detection:
    name: Security
    permissions:
      contents: read
      pull-requests: read
    uses: codemie-ai/ci-workflows/.github/workflows/reusable-secrets-detection.yml@main

  # Build once, share artifacts with test jobs
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [secrets-detection]
    if: |
      always() &&
      (needs.secrets-detection.result == 'success' || needs.secrets-detection.result == 'skipped')
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check licenses
        run: npm run license-check

      - name: Lint code
        run: npm run lint

      - name: Build project
        run: npm run build

      # Upload build artifacts to share with test jobs
      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 1

  # Test jobs run in parallel, reuse build artifacts
  test-ubuntu:
    name: Test (Ubuntu)
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Download pre-built dist (skip build step, saves ~15-20s)
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Run unit tests
        run: npx vitest run --project unit

      - name: Run integration tests
        run: npx vitest run --project cli

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    needs: [build]
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Download pre-built dist (skip build step, saves ~25-30s on Windows)
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Run unit tests
        run: npx vitest run --project unit

      - name: Run integration tests
        run: npx vitest run --project cli